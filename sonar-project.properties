# SonarQube / SonarCloud project configuration
sonar.projectKey=qybbs_atlassian-bigquery-mcp
sonar.projectName=atlassian-bigquery-mcp

# Path to source and test files
sonar.sources=src
sonar.tests=tests
sonar.exclusions=node_modules/**, dist/**, tests/**, docs/**, coverage/**

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Test coverage reports path (optional, for Vitest/LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
